server {
  listen 80;
  server_name www.putarianotelegram.net;
  return 301 https://putarianotelegram.net$request_uri;
}

server {
  listen 80 default_server;
  server_name putarianotelegram.net _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;
  client_max_body_size 1m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://putarianotelegram.net; upgrade-insecure-requests" always;

  error_page 404 /index.html;

  location = /index.html {
    internal;
    expires -1;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /sitemap.xml {
    proxy_pass http://backend:3000/api/public/sitemap.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
  }

  location ^~ /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
  }

  location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|webp|ico|woff2?|txt|xml)$ {
    expires 1y;
    try_files $uri =404;
  }

  location = / {
    try_files /index.html =404;
    expires -1;
  }

  location = /adicionar-grupo {
    try_files /index.html =404;
    expires -1;
  }

  location = /termos-de-uso {
    try_files /index.html =404;
    expires -1;
  }

  location ~ ^/categorias/[^/]+/?$ {
    try_files /index.html =404;
    expires -1;
  }

  location = /dash {
    try_files /index.html =404;
    expires -1;
  }

  location ~ ^/grupos/[^/]+/?$ {
    try_files /index.html =404;
    expires -1;
  }

  location = /admin {
    try_files /index.html =404;
    expires -1;
  }

  location ^~ /admin/ {
    try_files /index.html =404;
    expires -1;
  }

  location / {
    return 404;
    expires -1;
  }
}
